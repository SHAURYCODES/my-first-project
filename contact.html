<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoFlow | Contact</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-inner">
        <a class="brand" href="home.html">
          <span class="brand-dot"></span>
          ToDoFlow
        </a>
        <nav class="nav-links">
          <a href="home.html">Home</a>
          <a href="info.html">Info</a>
          <a class="active" href="contact.html">Contact Us</a>
          <button
            type="button"
            id="themeToggle"
            class="theme-toggle"
            aria-label="Switch to dark mode"
            title="Dark mode"
          >
            <svg
              class="theme-icon theme-icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg
              class="theme-icon theme-icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
          <a href="login.html" id="logoutBtn">Logout</a>
        </nav>
      </div>
    </header>

    <main class="page container">
      <section class="hero fade-up">
        <div>
          <h1>Contact Us</h1>
          <p>Need help or want to share feedback? Send us a message.</p>
        </div>
      </section>

      <section class="contact-grid fade-up">
        <article class="card content-card glass">
          <h2 class="title">Project Team</h2>
          <p class="subtitle">First-Year FEE Project</p>
          <p style="margin-top: 0">
            Email: shaury1233.be25@chitkarauniversity.edu.in<br />
            Phone: +91 92043 39763<br />
            Location: Chitkara University,Himachal Pardesh-174103.
          </p>
        </article>

        <article class="card content-card glass">
          <h2 class="title">Send Message</h2>
          <form id="contactForm">
            <div class="input-group">
              <label for="fullName">Full Name</label>
              <input id="fullName" type="text" required />
            </div>
            <div class="input-group">
              <label for="email">Email</label>
              <input id="email" type="email" required />
            </div>
            <div class="input-group">
              <label for="message">Message</label>
              <textarea id="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <p id="contactStatus" class="hint"></p>
          </form>
        </article>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
