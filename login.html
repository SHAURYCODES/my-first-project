<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDoFlow | Login</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <button
      type="button"
      id="themeToggle"
      class="theme-toggle theme-toggle--fixed"
      aria-label="Switch to dark mode"
      title="Dark mode"
    >
      <svg
        class="theme-icon theme-icon-sun"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
      </svg>
      <svg
        class="theme-icon theme-icon-moon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>
    <main class="login-wrap">
      <section class="card glass login-card fade-up">
        <h1 class="title">Welcome to ToDoFlow</h1>
        <p class="subtitle">Start your first-year JavaScript project with style.</p>

        <form id="loginForm">
          <div class="input-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your name" required />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Any 4+ characters"
              minlength="4"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%">Login</button>
          <p id="loginMessage" class="hint"></p>
        </form>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
